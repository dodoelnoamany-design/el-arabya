name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*' # ÂÌ‘ €· ·„«  —›⁄ √Ì Tag Ì»œ√ »Õ—› v
  workflow_dispatch: # Ì ÌÕ ·ﬂ  ‘€Ì·Â ÌœÊÌ« „‰ Ê«ÃÂ… GitHub

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      #  √ﬂœ √‰ Â–« «·„·› „ÊÃÊœ ›Ì „”«— scripts/ci-prune.ps1
      - name: Run CI prune script
        shell: powershell
        run: |
          if (Test-Path ".\scripts\ci-prune.ps1") {
            .\scripts\ci-prune.ps1
          } else {
            Write-Host "Skip: ci-prune.ps1 not found"
          }

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build renderer + app
        run: npm run build

      - name: Build Windows EXE (electron-builder)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Â–« «·√„— Ì÷„‰ »‰«¡ «·‰”Œ… «·„Êﬁ⁄…
        run: npx electron-builder --win --x64 --config.extraMetadata.main=main.js

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/**
            release/**

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}